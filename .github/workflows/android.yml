name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Zbuduj APK i AAB
        working-directory: android
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Nazwij pliki
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk czytnik-plikow.apk
          cp android/app/build/outputs/bundle/release/app-release.aab czytnik-plikow.aab

      - uses: actions/upload-artifact@v4
        with:
          name: czytnik-plikow-apk
          path: czytnik-plikow.apk

      # Pakiet dla Google Play (nowe aplikacje w sklepie wymagają AAB zamiast APK)
      - uses: actions/upload-artifact@v4
        with:
          name: czytnik-plikow-aab
          path: czytnik-plikow.aab

      - name: Wystaw do pobrania (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk czytnik-plikow.apk \
            --target "${{ github.sha }}" \
            --title "Czytnik plików na Androida (wersja 1.0.${{ github.run_number }})" \
            --notes "Plik APK do zainstalowania w telefonie lub tablecie z Androidem 8.0 lub nowszym. Bezpośredni link: https://github.com/${{ github.repository }}/releases/latest/download/czytnik-plikow.apk" \
            --latest
