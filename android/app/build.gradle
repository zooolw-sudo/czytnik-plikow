plugins {
    id 'com.android.application'
}

// Na GitHubie każde budowanie ma kolejny numer – używamy go jako numeru wersji.
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'pl.zooolw.czytnik'
    compileSdk 36

    defaultConfig {
        applicationId 'pl.zooolw.czytnik'
        // Android 8.0+ (m.in. tablet Huawei MediaPad T5)
        minSdk 26
        // Google Play: od 31.08.2026 nowe aplikacje i aktualizacje muszą celować w API 36
        targetSdk 36
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Stały klucz podpisu: kolejne wersje instalują się jako aktualizacja.
    signingConfigs {
        shared {
            storeFile rootProject.file('czytnik.keystore')
            storePassword 'czytnik'
            keyAlias 'czytnik'
            keyPassword 'czytnik'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
