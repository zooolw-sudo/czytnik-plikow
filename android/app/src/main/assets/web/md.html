<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dokument</title>
<link rel="stylesheet" href="common.css">
<style>
  #main { background: #fff; }
  .src { margin: 0; padding: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13.5px/1.5 "Roboto Mono", monospace; color: #1c2333; }
  .note { margin: 10px; padding: 9px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 13.5px; color: var(--text); }
</style>
</head>
<body>
<div class="main" id="main"><div id="box"></div></div>
<script src="common.js"></script>
<script src="lib/purify.min.js"></script>
<script src="lib/marked.js"></script>
<script src="safehtml.js"></script>
<script>
  'use strict';
  /*
   * Jedna strona dla Markdown (.md) i HTML (.html): treść bez skryptów,
   * w osobnym shadow DOM, z przełączeniem na tekst źródłowy.
   */
  const isMd = FILE.type === 'md';
  const main = document.getElementById('main');
  const box = document.getElementById('box');
  const MD_CSS = `
    .content { padding: 16px 16px 40px; max-width: 820px; margin: 0 auto; }
    h1, h2 { border-bottom: 1px solid #e3e7ee; padding-bottom: .25em; }
    h1 { font-size: 1.7em; margin: .6em 0 .5em; } h2 { font-size: 1.35em; margin: 1.2em 0 .5em; }
    h3 { font-size: 1.15em; margin: 1.1em 0 .4em; }
    code { background: #f2f4f8; padding: .1em .35em; border-radius: 5px; font: .9em "Roboto Mono", monospace; }
    pre { background: #f2f4f8; padding: 12px; border-radius: 10px; overflow-x: auto; white-space: pre; }
    pre code { background: none; padding: 0; }
    blockquote { margin: .8em 0; padding: .2em 1em; border-left: 4px solid #c9d3e3; color: #546077; }
    table { border-collapse: collapse; display: block; overflow-x: auto; margin: .8em 0; }
    th, td { border: 1px solid #d8dee8; padding: 6px 10px; }
    th { background: #f2f4f8; }
    hr { border: 0; border-top: 1px solid #e3e7ee; margin: 1.5em 0; }
    li > input[type=checkbox] { margin-right: .4em; }
  `;
  let raw = null, enc = null, showSource = false, search = null, finder = null, title = '';
  const zp = new ZoomPane(main, box, { min: 0.5, max: 4, fit: () => 1 });

  function decode(forced) {
    if (forced || isMd) return decodeText(raw, forced);
    const head = new TextDecoder('latin1').decode(new Uint8Array(raw, 0, Math.min(raw.byteLength, 4096)));
    const m = /<meta[^>]+charset\s*=\s*["']?([\w.:-]+)/i.exec(head);
    if (m && !/^utf-?8$/i.test(m[1])) {
      try { return { text: new TextDecoder(m[1].toLowerCase()).decode(raw), enc: m[1].toLowerCase() }; } catch (e) { /* zgadujemy */ }
    }
    return decodeText(raw);
  }

  function render() {
    if (finder) finder.close();
    const r = decode(enc);
    enc = r.enc;
    box.innerHTML = '';
    if (showSource) {
      const pre = h('pre', { class: 'src', text: r.text });
      box.append(pre);
      search = new DomSearch(pre, main);
    } else {
      let html;
      if (isMd) {
        html = marked.parse(r.text.replace(/^\uFEFF/, ''), { gfm: true })
          .replace(/<input[^>]*checked[^>]*>/gi, '☑ ').replace(/<input[^>]*type="checkbox"[^>]*>/gi, '☐ ');
      }
      else {
        const t = /<title[^>]*>([\s\S]*?)<\/title>/i.exec(r.text);
        title = t ? t[1].replace(/\s+/g, ' ').trim() : '';
        html = (r.text.match(/<style[\s\S]*?<\/style>/gi) || []).join('') + r.text;
      }
      const { frag, remote } = SafeHtml.sanitize(html);
      const host = h('div');
      box.append(host);
      const root = SafeHtml.mount(host, frag, isMd ? MD_CSS : '');
      search = new DomSearch(root, main);
      if (!isMd) box.prepend(h('div', { class: 'note', text: 'Strona pokazana bez skryptów' + (remote ? ` i bez ${remote} ${plPlural(remote, 'obrazu', 'obrazów', 'obrazów')} z internetu` : '') + '.' }));
    }
    UI.setSub([isMd ? 'Markdown' : (title || 'Strona HTML'), showSource ? 'tekst źródłowy' : null, encodingLabel(enc)].filter(Boolean).join(' · '));
  }

  UI.bar({
    actions: [{ icon: 'search', label: 'Szukaj', onClick: () => {
      finder = UI.find({
        onSearch: (q) => { const n = search.run(q); finder.count(n ? 1 : 0, n); },
        onNext: () => { search.next(); finder.count(search.cur + 1, search.hits.length); },
        onPrev: () => { search.prev(); finder.count(search.cur + 1, search.hits.length); },
        onClose: () => { search.clear(); finder = null; },
      });
    } }],
    menu: () => [
      { icon: 'text', label: 'Tekst źródłowy', checked: showSource, onClick: () => { showSource = !showSource; render(); } },
      { icon: 'toc', label: 'Kodowanie znaków…', onClick: () => chooseEncoding(enc, (e) => { enc = e; render(); }) },
    ],
  });

  (async () => {
    UI.loading('Otwieranie…');
    try {
      raw = await UI.fetchFile();
      render();
      UI.done();
    } catch (e) {
      console.error(e);
      UI.fail('Nie udało się otworzyć pliku', String(e && e.message || e));
    }
  })();
</script>
</body>
</html>
