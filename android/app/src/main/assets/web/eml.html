<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wiadomość</title>
<link rel="stylesheet" href="common.css">
<style>
  #main { background: var(--bg); }
  .mail { padding: 10px 10px 30px; }
  .head { background: var(--card); border-radius: 16px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
  .head h1 { font-size: 19px; margin: 0 0 10px; line-height: 1.3; word-break: break-word; }
  .from { display: flex; gap: 12px; align-items: center; }
  .avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 17px; }
  .from .who { min-width: 0; }
  .from .nm { font-weight: 600; font-size: 15px; word-break: break-word; }
  .from .em { font-size: 13px; color: var(--muted); word-break: break-all; }
  .meta { margin-top: 10px; font-size: 13.5px; }
  .meta .kv { grid-template-columns: auto 1fr; gap: 3px 10px; }
  .meta dd { word-break: break-word; }
  .atts { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 2px; scrollbar-width: none; }
  .att {
    flex: none; display: flex; align-items: center; gap: 10px; max-width: 250px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px 8px 8px; text-align: left;
  }
  .att:active { background: var(--accent-soft); }
  .att .ico { flex: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 9.5px; font-weight: 800; }
  .att .nm { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
  .att .sz { font-size: 12px; color: var(--muted); }
  .note { margin: 10px 2px 0; font-size: 13px; color: var(--muted); }
  .bodybox { margin-top: 10px; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
  .plain { margin: 0; padding: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font: 15px/1.5 Roboto, sans-serif; color: #1c2333; }
</style>
</head>
<body>
<div class="main" id="main"><div class="mail" id="box"></div></div>
<script src="common.js"></script>
<script src="lib/purify.min.js"></script>
<script src="safehtml.js"></script>
<script src="mime.js"></script>
<script src="eml.page.js"></script>
</body>
</html>
