<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Prezentacja</title>
<link rel="stylesheet" href="common.css">
<style>
  #main { background: #23272e; }
  .deck { padding: 12px 10px 30px; width: max-content; min-width: 100%; }
  .sw { margin: 0 auto 16px; width: fit-content; }
  .sw .num { color: #9aa3b2; margin: 0 0 5px 2px; font-family: Roboto, sans-serif; }
  .sw.hid .slide { opacity: .55; }
  .slide { position: relative; overflow: hidden; box-shadow: 0 3px 10px rgba(0, 0, 0, .45); background: #fff; }
  .slide .sh { position: absolute; box-sizing: border-box; }
  .slide .tx { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; overflow-wrap: break-word; }
  .slide .p { margin: 0; }
  .slide .bu { display: inline-block; text-indent: 0; }
  .slide a { color: inherit; }
  .slide .tbl { border-collapse: collapse; width: 100%; height: 100%; table-layout: fixed; }
  .slide .tbl td { border: 1px solid rgba(0, 0, 0, .2); padding: 0; overflow: hidden; }
  .slide .ph-box {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: repeating-linear-gradient(45deg, #f3f4f6, #f3f4f6 12px, #e9ebef 12px, #e9ebef 24px);
    color: #667; font: 600 22px sans-serif; border: 2px dashed #aab;
  }
  .notes { background: #fff8dc; color: #3a3426; white-space: pre-wrap; font-family: Roboto, sans-serif; border-radius: 0 0 8px 8px; }
  .notes[hidden] { display: none; }
  /* pokaz slajdów */
  .show { position: fixed; inset: 0; z-index: 95; background: #000; display: flex; align-items: center; justify-content: center; }
  .show .slide { box-shadow: none; }
  .show .cnt { position: absolute; bottom: 10px; right: 14px; color: #aaa; font: 13px sans-serif; }
</style>
</head>
<body>
<div class="main" id="main"><div class="deck" id="deck"></div></div>
<script src="common.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="odt.js"></script>
<script src="pptx.js"></script>
<script src="odp.js"></script>
<script src="slides.page.js"></script>
</body>
</html>
