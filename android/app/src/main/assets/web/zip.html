<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Archiwum</title>
<link rel="stylesheet" href="common.css">
<style>
  #main { padding: 0 0 30px; }
  .crumbs {
    display: flex; align-items: center; gap: 4px; overflow-x: auto; white-space: nowrap;
    padding: 10px 12px; font-size: 14px; color: var(--muted); scrollbar-width: none;
  }
  .crumbs button { border: 0; background: var(--card); color: var(--accent); border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 13.5px; }
  .crumbs button:last-child { color: var(--text); }
  .list { background: var(--card); margin: 0 10px; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
  .it { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .it:last-child { border-bottom: 0; }
  .it:active { background: var(--accent-soft); }
  .ico { flex: none; width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-size: 10.5px; font-weight: 800; }
  .ico svg { width: 24px; height: 24px; fill: #fff; }
  .it .t { flex: 1; min-width: 0; }
  .it .nm { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .chev { color: var(--muted); font-size: 20px; }
  .empty { padding: 30px 16px; text-align: center; color: var(--muted); }
  .warn { margin: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(214, 69, 69, .12); color: var(--danger); font-size: 14px; }
</style>
</head>
<body>
<div class="main" id="main"><div class="crumbs" id="crumbs"></div><div id="warn"></div><div class="list" id="list"></div></div>
<script src="common.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="zip.page.js"></script>
</body>
</html>
