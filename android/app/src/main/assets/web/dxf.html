<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rysunek DXF</title>
<link rel="stylesheet" href="common.css">
<style>
  #main { overflow: hidden; touch-action: none; background: #1d2026; }
  body.light #main { background: #fff; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .layer { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--border); font-size: 15px; }
  .layer input { width: 20px; height: 20px; accent-color: var(--accent); }
  .layer .sw { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0, 0, 0, .25); flex: none; }
  .layer .cnt { margin-left: auto; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="main" id="main"><canvas id="cv"></canvas></div>
<script src="common.js"></script>
<script src="lib/dxf-parser.js"></script>
<script src="dxf.page.js"></script>
</body>
</html>
