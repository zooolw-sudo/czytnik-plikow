<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Arkusz</title>
<link rel="stylesheet" href="common.css">
<style>
  body { --tabs-h: 0px; --info-h: 0px; }
  #main { bottom: calc(var(--tabs-h) + var(--info-h)); background: #fff; }
  table.grid {
    border-collapse: separate; border-spacing: 0; table-layout: fixed;
    font: 13px/1.3 Roboto, Arial, sans-serif; color: #111; background: #fff;
  }
  table.grid td {
    border-right: 1px solid #e2e5ea; border-bottom: 1px solid #e2e5ea;
    padding: 1px 4px; height: 21px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    vertical-align: bottom; background: #fff;
  }
  table.grid th {
    position: sticky; background: #f1f3f6; color: #5b6475;
    font-weight: 500; font-size: 12px;
    border-right: 1px solid #d3d8e0; border-bottom: 1px solid #d3d8e0;
    padding: 0 4px; overflow: hidden;
  }
  table.grid thead th { top: 0; z-index: 2; height: 22px; text-align: center; }
  table.grid tbody th { left: 0; z-index: 1; text-align: center; }
  table.grid thead th.corner { left: 0; z-index: 3; }
  td.n { text-align: right; }
  td.b, td.e { text-align: center; }
  td.e { color: #c62828; }
  td.spill { overflow: visible; position: relative; text-overflow: clip; }
  td.wrap { white-space: pre-wrap; overflow-wrap: anywhere; vertical-align: top; }
  td.ml { white-space: pre-line; vertical-align: top; }
  td.sel { outline: 2px solid #1a73e8; outline-offset: -2px; }
  td.hit { background: #fff1a6 !important; }
  td.hit.cur { background: #ffb547 !important; }
  tr.more td { text-align: center; color: #889; height: 40px; border: 0; }

  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--tabs-h);
    display: flex; overflow-x: auto; background: var(--card);
    border-top: 1px solid var(--border); scrollbar-width: none;
  }
  .tabs button {
    flex: none; border: 0; background: none; padding: 0 16px; font-size: 14px;
    color: var(--muted); border-top: 3px solid transparent; max-width: 60vw;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tabs button.on { color: var(--accent); border-top-color: var(--accent); font-weight: 600; background: var(--accent-soft); }
  .tabs button.hid { font-style: italic; opacity: .6; }
  .cellinfo {
    position: fixed; left: 0; right: 0; bottom: var(--tabs-h); min-height: 46px;
    background: var(--card); color: var(--text); border-top: 1px solid var(--border);
    display: flex; gap: 12px; align-items: center; padding: 6px 6px 6px 14px; font-size: 14.5px;
  }
  .cellinfo[hidden] { display: none; }
  .cellinfo .addr { font-weight: 700; color: var(--accent); flex: none; }
  .cellinfo .txt { flex: 1; min-width: 0; max-height: 28vh; overflow: auto; }
  .cellinfo .val { white-space: pre-wrap; word-break: break-word; }
  .cellinfo .f { color: var(--muted); font-family: monospace; font-size: 13px; word-break: break-all; }
  .empty { padding: 40px 20px; text-align: center; color: #778; font-size: 15px; }
</style>
</head>
<body>
<div class="main" id="main"><div id="content"></div></div>
<div class="cellinfo" id="cellinfo" hidden>
  <span class="addr" id="ciAddr"></span>
  <div class="txt"><div class="val" id="ciVal"></div><div class="f" id="ciF"></div></div>
  <button class="ibtn" id="ciClose" aria-label="Zamknij" style="color:var(--muted)"></button>
</div>
<div class="tabs" id="tabs" hidden></div>
<script src="common.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="sheetview.js"></script>
</body>
</html>
